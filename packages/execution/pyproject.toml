[project]
name = "agentforge-execution"
version = "0.1.0"
description = "AgentForge Execution Engine & Telemetry Tracing Layer"
requires-python = ">=3.11"
dependencies = [
    "agentforge-core",
    "agentforge-hardware",
]

[tool.uv.sources]
agentforge-core = { workspace = true }
agentforge-hardware = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
