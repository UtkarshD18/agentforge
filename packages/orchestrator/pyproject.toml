[project]
name = "agentforge-orchestrator"
version = "0.1.0"
description = "AgentForge Execution Orchestrator"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5.0",
    "agentforge-core",
    "agentforge-resources",
]

[tool.uv.sources]
agentforge-core = { workspace = true }
agentforge-resources = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
