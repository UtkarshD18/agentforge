[project]
name = "agentforge-providers"
version = "0.1.0"
description = "AgentForge Capability Providers Contract"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5.0",
    "agentforge-plugins",
    "google-generativeai>=0.3.0",
]

[tool.uv.sources]
agentforge-plugins = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
