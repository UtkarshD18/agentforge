[project]
name = "agentforge-video"
version = "0.1.0"
description = "AgentForge Basic Video & Audio Processing Tool adapters (FFmpeg, Whisper)"
requires-python = ">=3.11"
dependencies = [
    "agentforge-core",
    "agentforge-hardware",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
]

[tool.uv.sources]
agentforge-core = { workspace = true }
agentforge-hardware = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
