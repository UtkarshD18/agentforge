[project]
name = "agentforge-runtime"
version = "0.1.0"
description = "AgentForge Orchestrator Runtime Daemon"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
    "agentforge-core",
]

[tool.uv.sources]
agentforge-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
